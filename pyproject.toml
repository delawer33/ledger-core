[project]
name = "ledger-core"
version = "0.1.0"
description = "Double-entry ledger core: idempotent postings, holds, transactional outbox, reconciliation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<6.1",
    "django-ninja>=1.4",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "django-tasks-db>=0.13.0",
    "pydantic>=2.10",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    # ruff >= 0.16: the default rule set is ~400 rules; config extends it, never re-lists it.
    "ruff>=0.16",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.2",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pre-commit>=4.0",
    "deptry>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger", "src/config"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/ledger/migrations"]

[tool.ruff.lint]
extend-select = ["I", "PTH", "TC", "RET", "ISC", "TID", "PT", "ARG", "DTZ"]
# Prose in this repo is Cyrillic; those are not "ambiguous unicode" characters.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.v1".msg = "Pydantic v2 API only"
"requests".msg = "use httpx"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]
# Django Meta.constraints / indexes are class-level lists by API design.
"src/**/models.py" = ["RUF012"]

[tool.deptry.per_rule_ignores]
# Used by name in settings strings, not imported: the DB driver, the app server, the tasks backend, the static file middleware.
DEP002 = ["psycopg", "gunicorn", "django-tasks-db", "whitenoise"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["mypy_django_plugin.main"]
exclude = ["src/ledger/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "config.settings"
# A deprecation surfaces the day a dependency bump introduces it. Silence third-party noise with a
# targeted "ignore:<message>:<Category>" line, never by dropping this.
filterwarnings = ["error"]
markers = [
    "concurrency: multi-threaded proofs of the ledger guarantees on real Postgres (pytest -m concurrency)",
]
