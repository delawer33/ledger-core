services:
  api:
    container_name: ledger_core_api
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the network the database is `db:5432`; the .env value is for host-side runs.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Loopback only: the admin and API are not exposed on other interfaces.
      - "127.0.0.1:${API_PORT_EXTERNAL}:${API_PORT_INTERNAL}"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT_INTERNAL}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The same image as the api, running the periodic work (ADR-0016). Both wait for the api because
  # its start applies the migrations. Nothing here publishes a port.
  worker:
    container_name: ledger_core_worker
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "manage.py", "db_worker"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      # db_worker has no heartbeat; this proves the process can still reach the database.
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 15s

  scheduler:
    container_name: ledger_core_scheduler
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["python", "manage.py", "run_scheduler", "--heartbeat-file", "/tmp/scheduler-heartbeat"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      # Unhealthy when the loop has not completed a pass for three minutes.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/scheduler-heartbeat -mmin -3 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    container_name: ledger_core_db
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only, and never 5432: that port is often taken by another local Postgres.
      - "127.0.0.1:${DB_PORT_EXTERNAL}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
